[project]
name = "handson-42tokyo"
version = "0.6.0"
description = "42 Tokyoの魅力を答えるエージェント（ハンズオン配布リポジトリの試作）"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=2.11,<3",
    "litellm>=1.60",
    "openai>=1.60",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
